name: Release

# Tag a version to cut a release:
#   npm version patch && git push --follow-tags
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build and publish ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run assets
      - run: npm run build
        env:
          # Bakes the "this build can update itself on macOS" constant in. It
          # must be set at BUILD time: a packaged app started from Finder has no
          # shell environment, so reading it at runtime would always be false.
          PIANO_MIDI_MAC_SIGNED: ${{ secrets.MAC_CSC_LINK != '' && '1' || '0' }}

      # Signing turns itself on as soon as the secrets exist — no code change.
      # Until then the build is unsigned and macOS shows a Gatekeeper warning
      # on first launch, which is expected and documented in SIGNING.md.
      - name: Build and publish
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          # --- macOS: Developer ID certificate + notarization ---
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

          # --- Windows: Authenticode certificate ---
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if [[ "$RUNNER_OS" == "macOS" && -n "${CSC_LINK:-}" ]]; then
            echo "macOS: signing with Developer ID and notarizing"
            npx electron-builder --publish always --config.mac.notarize=true
          elif [[ "$RUNNER_OS" == "Windows" && -n "${WIN_CSC_LINK:-}" ]]; then
            echo "Windows: signing with Authenticode"
            npx electron-builder --publish always
          else
            echo "No signing credentials for $RUNNER_OS — building unsigned."
            # Without this, electron-builder finds any stray identity in the
            # runner keychain and blocks on it.
            export CSC_IDENTITY_AUTO_DISCOVERY=false
            npx electron-builder --publish always
          fi
